[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN001", "ANN201"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["E402", "ANN001", "ANN201"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
