<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Guardian Drive — real-time driver drowsiness alerts for parents and guardians." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Guardian Drive</title>
    <script>
      // Light / dark before the first paint (saved choice, else the system setting).
      (function () {
        try {
          var p = localStorage.getItem('gd:theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <!-- Startup loader: visible instantly while the app's JavaScript downloads; React replaces it. -->
    <div id="root">
      <style>
        .gd-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#05060f;color:#c7d2fe;font-family:Inter,system-ui,sans-serif}
        .gd-boot__ring{position:relative;width:84px;height:84px}
        .gd-boot__ring::before,.gd-boot__ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
        .gd-boot__ring::before{border-top-color:#818cf8;box-shadow:0 0 18px rgba(129,140,248,.5);animation:gd-spin 1.1s linear infinite}
        .gd-boot__ring::after{inset:12px;border-left-color:#10b981;animation:gd-spin 1.6s linear infinite reverse}
        .gd-boot__ring img{position:absolute;inset:27px;width:30px;height:30px}
        .gd-boot p{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.85}
        @keyframes gd-spin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.gd-boot__ring::before,.gd-boot__ring::after{animation-duration:4s}}
      </style>
      <div class="gd-boot" role="status" aria-label="Loading Guardian Drive">
        <div class="gd-boot__ring"><img src="/icons/icon.svg" alt="" /></div>
        <p>Loading Guardian Drive…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
